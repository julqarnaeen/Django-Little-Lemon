{% extends 'base.html' %}
{% load static %}
{% block content %}
<h1>Menu</h1>
<!--Begin col-->
<div class="column">
   <!-- Step 14: Create for loop -->
   {% for item in menu_items %}
   <p>
      <!-- Step 14: Add DTL variable for name -->
      <span class="menu-name">
         {{ item.name }}
         <a href="{% url 'menu_item' pk=item.pk %}">
            {{ item.name }}
        </a>
      </span>
      <!-- Step 14: Add DTL variable for price -->
      <span class="menu-price">
         ${{ item.price }}.00
      </span>
   </p>
   
   </p>
   <!-- Step 14: End or loop -->
    {% endfor %}
</div>
<!--End col-->
{% endblock %}
